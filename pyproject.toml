[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diffgrasp"
version = "0.1.0"
description = "Differentiable grasp synthesis with a procedural articulated hand (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ding Yuan" }]
keywords = ["grasp-synthesis", "robotics", "hand-object-interaction", "differentiable", "pytorch"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.0"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "pillow>=9", "scikit-image>=0.21"]
dev = ["pytest>=7", "matplotlib>=3.7", "pillow>=9", "scikit-image>=0.21"]

[tool.setuptools]
packages = ["diffgrasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skimage.*"]
